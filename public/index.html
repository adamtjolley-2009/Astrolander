<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Astrolander</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <button id="pauseBtn" class="pause hidden" aria-label="Pause">
    <svg viewBox="0 0 12 14"><path d="M3 1V13M9 1V13" /></svg>
  </button>

  <div id="controls">
    <div class="rot">
      <button class="ctl" id="btnLeft" aria-label="Rotate left">
        <svg viewBox="0 0 20 20"><path d="M14 3L5 10L14 17Z" /></svg>
      </button>
      <button class="ctl" id="btnRight" aria-label="Rotate right">
        <svg viewBox="0 0 20 20"><path d="M6 3L15 10L6 17Z" /></svg>
      </button>
    </div>
    <button class="ctl thrust" id="btnThrust" aria-label="Throttle"></button>
  </div>

  <script src="game.js"></script>
</body>
</html>
